<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cf-signoz — traces, logs, metrics</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Menlo, monospace; margin: 0; background: #0b0e14; color: #d6deeb; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: #11151f; position: sticky; top: 0; }
  header b { color: #82aaff; }
  input, button, select, textarea { background: #1a2030; color: #d6deeb; border: 1px solid #2a3350; border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; min-height: 130px; box-sizing: border-box; font: inherit; font-size: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: #9aa7c7; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; align-items: end; margin: 12px 0; }
  .card { background: #11151f; border: 1px solid #1c2338; border-radius: 8px; padding: 12px; margin: 12px 0; }
  svg text { fill: #d6deeb; font-size: 12px; }
  svg .edge-label { fill: #9aa7c7; font-size: 10px; }
  button { cursor: pointer; } button.active { background: #82aaff; color: #0b0e14; }
  main { padding: 14px; max-width: 1200px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1c2338; }
  tr.clickable { cursor: pointer; } tr.clickable:hover { background: #141a2a; }
  .err { color: #ff6b81; } .dim { color: #69738d; } .ok { color: #7ee787; }
  .gantt { position: relative; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; height: 22px; font-size: 12px; }
  .row .name { width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { flex: 1; position: relative; height: 14px; background: #141a2a; border-radius: 3px; }
  .row .bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; background: #82aaff; min-width: 2px; }
  .row .bar.error { background: #ff6b81; }
  .row .dur { width: 90px; text-align: right; color: #69738d; }
  pre { background: #11151f; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; }
  h2 { font-size: 15px; color: #82aaff; margin-top: 22px; }
  .pill { border: 1px solid #2a3350; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <b>cf-signoz</b>
  <input id="base" size="28" placeholder="API base (blank = same origin)">
  <input id="token" size="22" type="password" placeholder="Bearer token">
  <button id="save">Connect</button>
  <span id="status" class="dim">not connected</span>
  <span style="flex:1"></span>
  <button data-view="services" class="nav active">Services</button>
  <button data-view="traces" class="nav">Traces</button>
  <button data-view="logs" class="nav">Logs</button>
  <button data-view="metrics" class="nav">Metrics</button>
  <button data-view="map" class="nav">Map</button>
  <button data-view="dashboards" class="nav">Dashboards</button>
  <button data-view="alerts" class="nav">Alerts</button>
</header>
<main>
  <section id="view-services"></section>
  <section id="view-traces" hidden></section>
  <section id="view-logs" hidden></section>
  <section id="view-metrics" hidden></section>
  <section id="view-map" hidden></section>
  <section id="view-dashboards" hidden></section>
  <section id="view-alerts" hidden></section>
  <section id="view-trace" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let base = localStorage.getItem('cf-signoz-base') || '';
let token = sessionStorage.getItem('cf-signoz-token') || '';
$('base').value = base; $('token').value = token;

async function api(path, options = {}) {
  const res = await fetch(base + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error(path + ' -> HTTP ' + res.status);
  if (res.status === 204) return null;
  return res.json();
}
const apiWrite = (path, method, body) => api(path, { method, body: body == null ? undefined : JSON.stringify(body) });
const ms = (v) => (v == null ? '-' : Number(v).toFixed(1) + ' ms');
const pct = (v) => (Number(v || 0) * 100).toFixed(1) + '%';
const when = (sec) => sec ? new Date(sec * 1000).toLocaleString() : '-';
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function show(view) {
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  ['services','traces','logs','metrics','map','dashboards','alerts','trace'].forEach(v => $('view-' + v).hidden = v !== view);
  ({services: loadServices, traces: loadTraces, logs: loadLogs, metrics: loadMetrics, map: loadMap, dashboards: loadDashboards, alerts: loadAlerts}[view] || (() => {}))()
    .catch(e => { $('status').textContent = e.message; $('status').className = 'err'; });
}

async function loadServices() {
  const services = await api('/v1/services');
  $('status').textContent = 'connected · ' + services.length + ' services'; $('status').className = 'ok';
  $('view-services').innerHTML = '<h2>Services</h2>' + (services.length ? `
    <table><tr><th>Service</th><th>Spans</th><th>Errors</th><th>Error rate</th><th>p50</th><th>p95</th><th>p99</th><th>Last seen</th></tr>
    ${services.map(s => `<tr class="clickable" data-service="${esc(s.service_name)}">
      <td>${esc(s.service_name)}</td><td>${s.span_count}</td>
      <td class="${s.error_count ? 'err' : ''}">${s.error_count}</td><td>${pct(s.error_rate)}</td>
      <td>${ms(s.p50_ms)}</td><td>${ms(s.p95_ms)}</td><td>${ms(s.p99_ms)}</td><td class="dim">${when(s.last_seen)}</td></tr>`).join('')}
    </table>` : '<p class="dim">No spans yet. Send traces to /v1/traces first.</p>');
  document.querySelectorAll('[data-service]').forEach(tr => tr.onclick = () => loadOperations(tr.dataset.service));
}

async function loadOperations(service) {
  const ops = await api('/v1/services/' + encodeURIComponent(service) + '/operations');
  $('view-services').innerHTML = `<h2>${esc(service)} — operations</h2>
    <table><tr><th>Operation</th><th>Spans</th><th>Errors</th><th>Error rate</th><th>p95</th><th>avg</th></tr>
    ${ops.map(o => `<tr><td>${esc(o.name)}</td><td>${o.span_count}</td><td class="${o.error_count ? 'err' : ''}">${o.error_count}</td><td>${pct(o.error_rate)}</td><td>${ms(o.p95_ms)}</td><td>${ms(o.avg_ms)}</td></tr>`).join('')}
    </table><p><button onclick="show('services')">← services</button></p>`;
}

async function loadTraces() {
  const traces = await api('/v1/traces?limit=30');
  $('view-traces').innerHTML = '<h2>Traces</h2>' + (traces.length ? `
    <table><tr><th>Trace ID</th><th>Spans</th><th>Root operation</th></tr>
    ${traces.map(t => {
      const root = (t.spans || []).find(s => !(s.parent_span_id ?? s.parentSpanId)) || (t.spans || [])[0] || {};
      return `<tr class="clickable" data-trace="${esc(t.traceId)}"><td>${esc(t.traceId)}</td><td>${(t.spans || []).length}</td><td>${esc(root.name || '')}</td></tr>`;
    }).join('')}
    </table>` : '<p class="dim">No traces yet.</p>');
  document.querySelectorAll('[data-trace]').forEach(tr => tr.onclick = () => loadTrace(tr.dataset.trace));
}

async function loadTrace(traceId) {
  show('trace');
  const trace = await api('/v1/traces/' + traceId);
  let logs = [];
  try { logs = await api('/v1/traces/' + traceId + '/logs'); } catch (e) { /* logs are additive */ }
  const startOf = (s) => s.start_time ?? s.startTime, endOf = (s) => s.end_time ?? s.endTime;
  const idOf = (s) => s.span_id ?? s.spanId, parentOf = (s) => s.parent_span_id ?? s.parentSpanId;
  const spans = (trace.spans || []).slice().sort((a, b) => new Date(startOf(a)) - new Date(startOf(b)));
  const t0 = spans.length ? new Date(startOf(spans[0])).getTime() : 0;
  const t1 = spans.length ? Math.max(...spans.map(s => new Date(endOf(s)).getTime())) : 1;
  const spanById = new Map(spans.map(s => [idOf(s), s]));
  const depth = (s) => { let d = 0, cur = s; while (cur && parentOf(cur) && spanById.has(parentOf(cur))) { d++; cur = spanById.get(parentOf(cur)); } return d; };
  $('view-trace').innerHTML = `<h2>Trace ${esc(traceId)}</h2>
    <div class="gantt">${spans.map(s => {
      const start = new Date(startOf(s)).getTime(), end = new Date(endOf(s)).getTime();
      const left = ((start - t0) / (t1 - t0 || 1)) * 100, width = Math.max(((end - start) / (t1 - t0 || 1)) * 100, 0.3);
      const isErr = s.status && (s.status.code === 2 || s.status.code === 'Error');
      return `<div class="row"><span class="name" title="${esc(s.name)}">${'· '.repeat(depth(s))}${esc(s.name)}</span>
        <span class="track"><span class="bar ${isErr ? 'error' : ''}" style="left:${left}%;width:${width}%"></span></span>
        <span class="dur">${ms(end - start)}</span></div>`;
    }).join('')}</div>
    <h2>Logs for this trace (${logs.length})</h2>
    ${logs.length ? `<table><tr><th>Time</th><th>Service</th><th>Severity</th><th>Body</th></tr>
      ${logs.map(l => `<tr><td class="dim">${when(l.timestamp)}</td><td>${esc(l.service_name)}</td><td class="${l.severity_number >= 17 ? 'err' : ''}">${esc(l.severity_text)}</td><td>${esc(l.body)}</td></tr>`).join('')}</table>`
      : '<p class="dim">No logs with this trace_id.</p>'}
    <p><button onclick="show('traces')">← traces</button></p>`;
}

async function loadLogs() {
  const logs = await api('/v1/logs?limit=100');
  $('view-logs').innerHTML = '<h2>Logs</h2>' + (logs.length ? `
    <table><tr><th>Time</th><th>Service</th><th>Severity</th><th>Trace</th><th>Body</th></tr>
    ${logs.map(l => `<tr><td class="dim">${when(l.timestamp)}</td><td>${esc(l.service_name)}</td>
      <td class="${l.severity_number >= 17 ? 'err' : ''}">${esc(l.severity_text)}</td>
      <td>${l.trace_id ? `<a href="#" data-logtrace="${esc(l.trace_id)}">${esc(l.trace_id.slice(0, 12))}…</a>` : '-'}</td>
      <td>${esc(l.body)}</td></tr>`).join('')}</table>` : '<p class="dim">No logs yet. Send to /v1/logs.</p>');
  document.querySelectorAll('[data-logtrace]').forEach(a => a.onclick = (e) => { e.preventDefault(); loadTrace(a.dataset.logtrace); });
}

async function loadMetrics() {
  const summary = await api('/v1/metrics/summary');
  $('view-metrics').innerHTML = '<h2>Metrics</h2>' + (summary.length ? `
    <table><tr><th>Service</th><th>Metric</th><th>Kind</th><th>Samples</th><th>avg</th><th>min</th><th>max</th><th>last</th></tr>
    ${summary.map(m => `<tr><td>${esc(m.service_name)}</td><td>${esc(m.metric_name)}</td><td><span class="pill">${esc(m.kind)}</span></td>
      <td>${m.sample_count}</td><td>${Number(m.avg).toFixed(2)}</td><td>${Number(m.min).toFixed(2)}</td><td>${Number(m.max).toFixed(2)}</td><td>${Number(m.last_value).toFixed(2)}</td></tr>`).join('')}
    </table>` : '<p class="dim">No metric samples yet. Send to /v1/metrics.</p>');
}

function serviceTable(services) {
  if (!services.length) return '<p class="dim">No service data yet.</p>';
  return `<table><tr><th>Service</th><th>Spans</th><th>Errors</th><th>Error rate</th><th>p95</th></tr>
    ${services.map(s => `<tr><td>${esc(s.service_name)}</td><td>${s.span_count}</td><td class="${s.error_count ? 'err' : ''}">${s.error_count}</td><td>${pct(s.error_rate)}</td><td>${ms(s.p95_ms)}</td></tr>`).join('')}</table>`;
}

async function loadMap() {
  const map = await api('/v1/service-map');
  const cols = Math.max(1, Math.ceil(Math.sqrt(map.nodes.length || 1)));
  const width = Math.max(680, cols * 230);
  const height = Math.max(240, Math.ceil((map.nodes.length || 1) / cols) * 120 + 40);
  const pos = new Map(map.nodes.map((node, i) => [node.service_name, { x: 110 + (i % cols) * 220, y: 55 + Math.floor(i / cols) * 115 }]));
  const lines = map.edges.map(edge => {
    const a = pos.get(edge.source), b = pos.get(edge.target);
    if (!a || !b) return '';
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#82aaff" stroke-width="1.5" marker-end="url(#arrow)"/><text class="edge-label" x="${mx}" y="${my - 4}">${edge.call_count} calls · ${pct(edge.error_rate)}</text>`;
  }).join('');
  const circles = map.nodes.map(node => {
    const p = pos.get(node.service_name);
    return `<circle cx="${p.x}" cy="${p.y}" r="27" fill="${node.error_count ? '#3a1622' : '#16233a'}" stroke="${node.error_count ? '#ff6b81' : '#82aaff'}"/><text x="${p.x}" y="${p.y - 2}" text-anchor="middle">${esc(node.service_name)}</text><text class="edge-label" x="${p.x}" y="${p.y + 14}" text-anchor="middle">p95 ${ms(node.p95_ms)}</text>`;
  }).join('');
  $('view-map').innerHTML = `<h2>Service map</h2>
    ${map.nodes.length ? `<svg viewBox="0 0 ${width} ${height}" width="100%" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#82aaff"/></marker></defs>${lines}${circles}</svg>` : '<p class="dim">No spans yet.</p>'}
    <h2>Edges</h2>${map.edges.length ? `<table><tr><th>Source</th><th>Target</th><th>Calls</th><th>Errors</th><th>Error rate</th><th>avg child duration</th><th>p95 child duration</th></tr>
    ${map.edges.map(e => `<tr><td>${esc(e.source)}</td><td>${esc(e.target)}</td><td>${e.call_count}</td><td>${e.error_count}</td><td>${pct(e.error_rate)}</td><td>${ms(e.avg_duration_ms)}</td><td>${ms(e.p95_duration_ms)}</td></tr>`).join('')}</table>` : '<p class="dim">No cross-service parent/child edges found.</p>'}`;
}

let dashboardCache = [];

async function renderDashboardPanels(board) {
  const panels = Array.isArray(board?.config?.panels) ? board.config.panels : [];
  if (!panels.length) return '<p class="dim">This dashboard has no panels. Supported panel types: services, service_map, metrics_summary.</p>';
  const rendered = [];
  for (const panel of panels) {
    if (panel.type === 'services') {
      rendered.push(`<div class="card"><h2>${esc(panel.title || 'Services')}</h2>${serviceTable(await api('/v1/services'))}</div>`);
    } else if (panel.type === 'service_map') {
      const map = await api('/v1/service-map');
      rendered.push(`<div class="card"><h2>${esc(panel.title || 'Service map')}</h2><p>${map.nodes.length} services · ${map.edges.length} cross-service edges</p><p><button onclick="show('map')">Open full map</button></p></div>`);
    } else if (panel.type === 'metrics_summary') {
      const metrics = await api('/v1/metrics/summary');
      rendered.push(`<div class="card"><h2>${esc(panel.title || 'Metrics')}</h2>${metrics.length ? `<table><tr><th>Service</th><th>Metric</th><th>Samples</th><th>avg</th><th>last</th></tr>${metrics.map(m => `<tr><td>${esc(m.service_name)}</td><td>${esc(m.metric_name)}</td><td>${m.sample_count}</td><td>${Number(m.avg).toFixed(2)}</td><td>${Number(m.last_value).toFixed(2)}</td></tr>`).join('')}</table>` : '<p class="dim">No metric samples.</p>'}</div>`);
    } else {
      rendered.push(`<div class="card"><h2>${esc(panel.title || panel.type || 'Panel')}</h2><p class="err">Unsupported panel type: ${esc(panel.type || '')}</p></div>`);
    }
  }
  return rendered.join('');
}

async function loadDashboards(selectedId) {
  dashboardCache = await api('/v1/dashboards');
  const selected = dashboardCache.find(d => d.id === selectedId) || dashboardCache[0];
  $('view-dashboards').innerHTML = `<h2>Dashboards</h2>
    <div class="form">
      <label>Name<input id="dash-name" value="${esc(selected?.name || 'Service overview')}"></label>
      <label>Open dashboard<select id="dash-select">${dashboardCache.map(d => `<option value="${esc(d.id)}" ${selected?.id === d.id ? 'selected' : ''}>${esc(d.name)} (${esc(d.id)})</option>`).join('')}</select></label>
      <button id="dash-load">Open</button><button id="dash-sample">Create sample</button>
      <button id="dash-save">Save config</button><button id="dash-export">Export</button><button id="dash-import">Import</button>
      ${selected ? '<button id="dash-delete">Delete</button>' : ''}
    </div>
    ${selected ? `<p class="dim">id: ${esc(selected.id)} · config_hash: ${esc(selected.config_hash)} · updated: ${when(selected.updated_at)}</p>` : '<p class="dim">No dashboards yet.</p>'}
    <label>Dashboard JSON<textarea id="dash-json">${esc(selected ? JSON.stringify(selected.config, null, 2) : JSON.stringify({version:1,panels:[{type:'services',title:'Services'},{type:'service_map',title:'Dependencies'},{type:'metrics_summary',title:'Metrics'}]}, null, 2))}</textarea></label>
    <div id="dash-panels">${selected ? await renderDashboardPanels(selected) : ''}</div>`;

  $('dash-load').onclick = () => loadDashboards($('dash-select').value).catch(showError);
  $('dash-sample').onclick = async () => {
    const board = await apiWrite('/v1/dashboards', 'POST', { name: 'Service overview', config: { version: 1, panels: [{type:'services',title:'Services'},{type:'service_map',title:'Dependencies'},{type:'metrics_summary',title:'Metrics'}] } });
    await loadDashboards(board.id);
  };
  $('dash-save').onclick = async () => {
    let config;
    try { config = JSON.parse($('dash-json').value); } catch (e) { throw new Error('Dashboard JSON is invalid: ' + e.message); }
    const board = await apiWrite('/v1/dashboards', 'POST', { id: selected?.id, name: $('dash-name').value, config });
    await loadDashboards(board.id);
  };
  $('dash-export').onclick = () => {
    if (!selected) return;
    $('dash-json').value = JSON.stringify({ dashboards: [{ id: selected.id, name: selected.name, config: selected.config }] }, null, 2);
    $('dash-json').select();
  };
  $('dash-import').onclick = async () => {
    const parsed = JSON.parse($('dash-json').value);
    const payload = Array.isArray(parsed.dashboards) ? parsed : { dashboards: [parsed] };
    const imported = await apiWrite('/v1/dashboards/import', 'POST', payload);
    await loadDashboards(imported[0]?.id);
  };
  if (selected) $('dash-delete').onclick = async () => { await apiWrite('/v1/dashboards/' + encodeURIComponent(selected.id), 'DELETE'); await loadDashboards(); };
}

async function loadAlerts() {
  const [rules, events] = await Promise.all([api('/v1/alert-rules'), api('/v1/alert-events?limit=50')]);
  $('view-alerts').innerHTML = `<h2>Alerts</h2>
    <div class="card"><h2>New / update rule</h2><div class="form">
      <label>Name<input id="alert-name" value="Checkout error rate"></label>
      <label>Service (blank = all)<input id="alert-service" value="checkout"></label>
      <label>Metric<select id="alert-metric"><option value="error_rate">error_rate (0–1)</option><option value="p95_ms">p95_ms</option><option value="span_count">span_count</option></select></label>
      <label>Operator<select id="alert-operator"><option>&gt;</option><option>&gt;=</option><option>&lt;</option><option>&lt;=</option><option>==</option></select></label>
      <label>Threshold<input id="alert-threshold" type="number" step="any" value="0.05"></label>
      <label>Window seconds<input id="alert-window" type="number" value="300"></label>
      <label>Cooldown seconds<input id="alert-cooldown" type="number" value="600"></label>
      <label>Webhook URL<input id="alert-webhook" placeholder="https://hooks.example/..."></label>
      <label>Enabled<select id="alert-enabled"><option value="true">true</option><option value="false">false</option></select></label>
      <button id="alert-save">Save rule</button><button id="alert-evaluate">Evaluate now</button>
    </div><p class="dim">Worker Cron runs every 5 minutes; “Evaluate now” uses the same deterministic evaluator and records events immediately. Webhook delivery happens on the Cron path and is stored on each event.</p>
    <pre id="alert-result" hidden></pre></div>
    <h2>Rules (${rules.length})</h2>${rules.length ? `<table><tr><th>Name</th><th>Service</th><th>Condition</th><th>Window</th><th>Cooldown</th><th>Enabled</th><th>Webhook</th><th>Last fired</th><th></th></tr>
      ${rules.map(r => `<tr><td>${esc(r.name)}<br><span class="dim">${esc(r.id)}</span></td><td>${esc(r.service_name || '*')}</td><td>${esc(r.metric)} ${esc(r.operator)} ${r.threshold}</td><td>${r.window_seconds}s</td><td>${r.cooldown_seconds}s</td><td>${r.enabled}</td><td>${r.webhook_url ? 'yes' : 'no'}</td><td>${when(r.last_fired_at)}</td><td><button data-delete-rule="${esc(r.id)}">Delete</button></td></tr>`).join('')}</table>` : '<p class="dim">No alert rules yet.</p>'}
    <h2>Events (${events.length})</h2>${events.length ? `<table><tr><th>Fired</th><th>Rule</th><th>Service</th><th>Observed</th><th>Threshold</th><th>Status</th><th>Delivery</th></tr>
      ${events.map(e => `<tr><td class="dim">${when(e.fired_at)}</td><td>${esc(e.rule_id)}</td><td>${esc(e.service_name)}</td><td>${Number(e.observed_value).toFixed(4)}</td><td>${esc(e.metric)} ${esc(e.operator)} ${e.threshold}</td><td class="err">${esc(e.status)}</td><td>${esc(e.delivery_status)}${e.delivery_error ? ' · ' + esc(e.delivery_error) : ''}</td></tr>`).join('')}</table>` : '<p class="dim">No alert events.</p>'}`;

  $('alert-save').onclick = async () => {
    await apiWrite('/v1/alert-rules', 'POST', {
      name: $('alert-name').value,
      service_name: $('alert-service').value || null,
      metric: $('alert-metric').value,
      operator: $('alert-operator').value,
      threshold: Number($('alert-threshold').value),
      window_seconds: Number($('alert-window').value),
      cooldown_seconds: Number($('alert-cooldown').value),
      webhook_url: $('alert-webhook').value || null,
      enabled: $('alert-enabled').value === 'true',
    });
    await loadAlerts();
  };
  $('alert-evaluate').onclick = async () => {
    const results = await apiWrite('/v1/alerts/evaluate', 'POST');
    $('alert-result').hidden = false;
    $('alert-result').textContent = JSON.stringify(results, null, 2);
    setTimeout(() => loadAlerts().catch(showError), 250);
  };
  document.querySelectorAll('[data-delete-rule]').forEach(button => button.onclick = async () => {
    await apiWrite('/v1/alert-rules/' + encodeURIComponent(button.dataset.deleteRule), 'DELETE');
    await loadAlerts();
  });
}

function showError(e) { $('status').textContent = e.message; $('status').className = 'err'; }


$('save').onclick = () => {
  base = $('base').value.replace(/\/$/, ''); token = $('token').value;
  localStorage.setItem('cf-signoz-base', base); sessionStorage.setItem('cf-signoz-token', token);
  show('services');
};
document.querySelectorAll('.nav').forEach(b => b.onclick = () => show(b.dataset.view));
if (token) show('services');
</script>
</body>
</html>
